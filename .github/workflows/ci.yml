name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against fresh runners, toolchains, and setup-php so a green
  # badge means "green this week", not "green at the last commit".
  # GitHub disables scheduled workflows in public repos after 60 days with
  # no repository activity; the weekly Dependabot PRs (and merging them)
  # are what keep this schedule alive. If it ever goes dormant, re-enable
  # it from the Actions tab or push any commit.
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # NOTE: setting RUSTFLAGS replaces .cargo/config.toml's rustflags arrays.
  # Acceptable in CI (correctness never depends on per-repo codegen flags);
  # release.yml re-asserts any shipped-binary flags via X86_RUSTFLAGS in
  # .ext-template.conf.
  RUSTFLAGS: -D warnings
  # Opt every JavaScript-based action into the Node 24 runtime ahead of
  # GitHub's June 2026 forced cut-over. `actions/checkout@v4` and the
  # rust-toolchain / setup-php / rust-cache actions all still ship Node
  # 20 bundles; without this, each run emits a "Node.js 20 actions are
  # deprecated" warning per leg. Once the upstream actions ship Node-24
  # bundles natively, this line can drop.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev
          # Pin bindgen to the LLVM that libclang-dev installed. ubuntu-26.04
          # runners preinstall clang 20, 21 and 22; unpinned, clang-sys loads
          # the newest libclang (22) while the builtin headers come from
          # libclang-dev's LLVM (21), and clang 22 dropped x86 builtins those
          # headers still call -> "Unable to generate bindings for PHP"
          # (reproduced with ext-php-rs 0.15.13 and 0.16.3 alike).
          v=$(dpkg-query -W -f='${Depends}' libclang-dev | grep -o 'libclang-[0-9]*-dev' | grep -o '[0-9]\+' | head -1)
          echo "LIBCLANG_PATH=/usr/lib/llvm-$v/lib" >> "$GITHUB_ENV"
          if [ -x "/usr/lib/llvm-$v/bin/clang" ]; then
            echo "CLANG_PATH=/usr/lib/llvm-$v/bin/clang" >> "$GITHUB_ENV"
          fi
          echo "bindgen pinned to LLVM $v"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (PHP ${{ matrix.php }} ${{ matrix.ts }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    # ZTS legs are informational until they have a track record; NTS legs
    # gate merges as before.
    continue-on-error: ${{ matrix.ts == 'zts' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]   # macos-14 is the arm64 runner
        # 8.5 is the current stable; 8.4 is the most-deployed; 8.3 is
        # security-only through end of 2026 but still widely installed.
        php: ['8.3', '8.4', '8.5']
        ts: [nts]
        include:
          # Thread-safe PHP (FrankenPHP, Apache mpm_worker/event + mod_php,
          # parallel). Linux only: setup-php's ZTS builds are Ubuntu-native.
          - { os: ubuntu-latest, php: '8.4', ts: zts }
          - { os: ubuntu-latest, php: '8.5', ts: zts }
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev
          # Pin bindgen to the LLVM that libclang-dev installed. ubuntu-26.04
          # runners preinstall clang 20, 21 and 22; unpinned, clang-sys loads
          # the newest libclang (22) while the builtin headers come from
          # libclang-dev's LLVM (21), and clang 22 dropped x86 builtins those
          # headers still call -> "Unable to generate bindings for PHP"
          # (reproduced with ext-php-rs 0.15.13 and 0.16.3 alike).
          v=$(dpkg-query -W -f='${Depends}' libclang-dev | grep -o 'libclang-[0-9]*-dev' | grep -o '[0-9]\+' | head -1)
          echo "LIBCLANG_PATH=/usr/lib/llvm-$v/lib" >> "$GITHUB_ENV"
          if [ -x "/usr/lib/llvm-$v/bin/clang" ]; then
            echo "CLANG_PATH=/usr/lib/llvm-$v/bin/clang" >> "$GITHUB_ENV"
          fi
          echo "bindgen pinned to LLVM $v"

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        # `true` when the extension needs nothing beyond Xcode CLT.
        run: brew install cmake

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Confirm thread-safety mode
        run: |
          php -r 'echo "PHP ", PHP_VERSION, " ZTS=", var_export((bool) PHP_ZTS, true), "\n"; exit((PHP_ZTS ? "zts" : "nts") === "${{ matrix.ts }}" ? 0 : 1);'

      - name: Fetch run-tests.php
        run: |
          PHP_VERSION=$(php -r 'echo PHP_VERSION;')
          curl -sSL "https://raw.githubusercontent.com/php/php-src/PHP-${PHP_VERSION%.*}/run-tests.php" -o run-tests.php
          test -s run-tests.php

      - uses: dtolnay/rust-toolchain@stable

      # `ext-php-rs` generates PHP-version-specific FFI bindings during its
      # build script — those bindings are baked into the cached `target/`
      # tree. The default rust-cache key doesn't include the matrix PHP
      # version, so without this scoping the PHP 8.3 leg primes the cache
      # and the PHP 8.4 leg restores PHP-8.3-bound artifacts, which then
      # fail to load into a PHP 8.4 process at runtime.
      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts }}

      - name: Build
        run: cargo build --verbose

      - name: Sanity-load the extension
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then SUFFIX=dylib; else SUFFIX=so; fi
          EXT="$PWD/target/debug/libwhisper.$SUFFIX"
          test -f "$EXT"
          php -d extension="$EXT" -r 'if (!extension_loaded("whisper")) { fwrite(STDERR, "whisper not loaded\n"); exit(1); } echo "ok\n";'

      - name: Run PHPT tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then SUFFIX=dylib; else SUFFIX=so; fi
          EXT="$PWD/target/debug/libwhisper.$SUFFIX"
          # `run-tests.php` parses TEST_PHP_ARGS by splitting on single spaces,
          # so the ini override must be `-d extension=...` (with the space).
          TEST_PHP_EXECUTABLE=$(which php) \
          TEST_PHP_ARGS="-d extension=$EXT" \
            php run-tests.php -q --show-diff tests/phpt

      - name: Stubs match the registered classes
        # The curated stubs must declare exactly what the extension
        # registers: classes, finality, parents, interfaces, constants,
        # and every method's modifiers, parameters, defaults and return
        # type. Two processes because both sides declare the same names.
        shell: bash
        run: |
          if [ ! -f stubs/whisper.stubs.php ]; then
            echo "::warning::stubs/whisper.stubs.php doesn't exist yet; skipping the stubs check"
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then SUFFIX=dylib; else SUFFIX=so; fi
          EXT="$PWD/target/debug/libwhisper.$SUFFIX"
          php -d extension="$EXT" .github/scripts/stubs-check.php runtime whisper > "$RUNNER_TEMP/stubs-runtime.txt"
          php .github/scripts/stubs-check.php stubs stubs/whisper.stubs.php "Displace\\Whisper\\" > "$RUNNER_TEMP/stubs-curated.txt"
          diff -u "$RUNNER_TEMP/stubs-curated.txt" "$RUNNER_TEMP/stubs-runtime.txt"
